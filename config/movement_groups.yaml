# config/movement_groups.yaml — grupos de movimentos processuais usados como COVARIÁVEIS de trajetória.
#
# Instrumento de medida (CLAUDE.md §12 / policy §5.3): versionado, com os códigos explícitos, lido por
# `src/alj/trajectories.py` e aplicado pelo passo 31. **Nenhum grupo é rótulo** (CLAUDE.md §2): dizer que um
# processo foi extinto sem resolução de mérito não diz que a litigância foi abusiva, e o grupo de comparação é
# "não sinalizado", nunca "legítimo" (§3).
#
# Fonte dos códigos: tabela de movimentos da TPU (Tabelas Processuais Unificadas) do CNJ, espelhada em
# `data/raw/cnj/sgt/movimentos.csv` (964 códigos, UTF-8, `;`-separado, SHA-256 em `logs/raw_hashes.tsv`).
# Os dois grupos grandes são o **pai da TPU expandido nos filhos ativos** — 218 "Sem Resolução de Mérito"
# (78 códigos) e 385 "Com Resolução do Mérito" (193 códigos). As listas ficam escritas aqui, e não resolvidas em
# tempo de execução, porque `data/` é git-ignored: o instrumento tem de ser reproduzível a partir do repositório.
#
# ACHADO QUE IMPORTA PARA O ARTIGO: a TPU **não tem movimento** para litigância de má-fé, abuso processual, ato
# atentatório à dignidade da justiça ou multa processual (a busca por essas expressões na tabela devolve apenas
# dois movimentos eleitorais sobre mesário faltoso). A sanção por litigância abusiva, portanto, **não deixa
# rastro na trajetória** — só no texto da decisão. Isso é uma limitação da fonte, não do método, e é a razão
# empírica de o léxico textual continuar sendo o instrumento primário.
#
# Para estender: rode `uv run python scripts/31_trajectory_features.py --vocabulary --top 80`, que lista os
# códigos realmente presentes neste corpus com a contagem de casos por grupo (k ≥ 5), e acrescente o grupo aqui
# com os códigos da TPU — subindo a versão.

version: 0.1.0
source: >
  CNJ TPU (tabela de movimentos), data/raw/cnj/sgt/movimentos.csv, 964 códigos; hierarquia pai→filhos usada para
  expandir 218 e 385. Confirmado em 2026-10-09 contra os movimentos coletados pelo passo 30.

