[project]
name = "abusive-litigation-jurimetrics"
version = "0.1.0"
description = "Detecting Patterns of Abusive Litigation: an explainable, human-centered jurimetric framework (research code)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Valber Gregory" }]
dependencies = [
  "polars>=1.30",
  "pyarrow>=19",
  "duckdb>=1.3",
  "httpx>=0.28",
  "pypdf>=5",
  "scikit-learn>=1.6",
  "networkx>=3.4",
  "doit>=0.36",
  "pandas>=2.2",
  "pyyaml>=6.0",       # config/lexicon_v2.yaml is the versioned measurement instrument
  "matplotlib>=3.9",   # scripts/81_build_figures.py (PDF for LaTeX + PNG)
]

[project.optional-dependencies]
# heavy: only install when the design requires embeddings / graphs at scale
nlp = ["sentence-transformers>=3.4", "torch>=2.6"]
graph = ["igraph>=0.11"]
stats = ["statsmodels>=0.14", "shap>=0.46"]
dev = ["pytest>=8", "ruff>=0.9", "jupyter>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alj"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, bugbear. Naive datetimes are intentional (Brasília local time in court data).
select = ["E", "F", "I", "B"]
ignore = ["E501"]
